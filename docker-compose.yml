services:
  memos-rag:
    build: .
    container_name: memos-rag
    restart: unless-stopped
    ports:
      - "8501:8501" # 访问这个端口打开网页
    volumes:
      # === 数据库挂载 (这是核心) ===
      # 改为挂载整个目录，以支持 SQLite WAL 模式 (需要同时读取 .db, .wal, .shm)
      - /home/sytssmys/.memos:/data/memos_folder:ro
      
      # === 向量库持久化 ===
      # 把生成的向量存到 data 目录下的 chroma_db 文件夹 (已在 .gitignore 中忽略)
      - ./data/chroma_db:/data/chroma_db
      
    environment:
      # 告诉程序去哪里读数据库
      - MEMOS_DB_PATH=/data/memos_folder/memos.db
      - CHROMA_DB_PATH=/data/chroma_db
      
      # API 配置 (必填)
      - OPENAI_API_KEY=${OPENAI_API_KEY} # 会读取你系统环境变量
      - OPENAI_API_BASE=https://open.bigmodel.cn/api/paas/v4/
      - OPENAI_MODEL_NAME=glm-4.6
